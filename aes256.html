<!DOCTYPE html>
<html>

<head>
<title>AES256 Key</title>
</head>

<body style="background-color: #cbe8f5;">
<h1>AES256 Key</h1>

<p id="generatedText">Loading key...</p>

<button onclick="generateNewKey()">Generate New Key</button>

<a href="index.html"><button>Back to Home</button></a>

<script>
  function generateNewKey() {
    let key = '';
    for (let i = 0; i < 64; i++) {
      key += Math.floor(Math.random() * 16).toString(16);
    }
    document.getElementById('generatedText').textContent = 'AES256 Key: ' + key;
  }

  generateNewKey();
</script>

</body>

</html>
